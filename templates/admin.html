<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Admin</title><link rel="stylesheet" href="/static/style.css"></head><body><header><b>👑 Owner Admin</b><nav><button onclick="location='/'">Public Wheel</button><button onclick="logout()">Logout</button></nav></header><main style="padding:22px;max-width:850px;margin:auto"><section style="background:#fff;padding:24px;border-radius:18px"><h2>🎯 Choose the winner</h2><p>Type any number or name that exists on the wheel.</p><input id="target" placeholder="Example: 5 or Daniel" style="width:100%;padding:15px;font-size:18px;border:1px solid #ccd3df;border-radius:10px"><button onclick="makeWin()" style="width:100%;margin-top:10px;background:#e53935;color:#fff;font-size:18px">MAKE THIS WIN</button><button onclick="clearTarget()" style="width:100%;margin-top:8px">CLEAR TARGET</button><p id="status"></p><hr><h3>📱 Private phone control</h3><p>Generate the private link and open it on your phone. It is not shown on the public wheel.</p><button onclick="phone()" style="background:#10b981;color:#fff">CREATE / RESET MY PHONE CONTROL</button><p id="link" style="word-break:break-all"></p></section><section style="background:#fff;padding:24px;border-radius:18px;margin-top:18px"><h2>Owner history</h2><div id="events">Loading...</div></section></main><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>let token="",s;async function phone(silent=false){let r=await fetch("/api/admin/new-control-link",{method:"POST"}),d=await r.json();if(!r.ok)return alert(d.error||"Login required");token=new URL(d.control_url,location.origin).searchParams.get("token");link.innerHTML="<b>Private phone link:</b><br><a target='_blank' href='"+d.control_url+"'>"+location.origin+d.control_url+"</a>";if(s)s.disconnect();s=io();s.on("connect",()=>s.emit("owner_join",{token}));s.on("owner_ready",d=>status.textContent=d.target?"Current target: "+d.target:"Connected.");}async function makeWin(){if(!token)await phone(true);let t=target.value.trim();if(!t)return alert("Enter a number or name.");s.emit("set_target",{token,target:t});status.textContent="Target set to: "+t}function clearTarget(){if(s)s.emit("clear_target",{token});status.textContent="Target cleared."}async function logout(){await fetch("/api/logout",{method:"POST"});location="/admin-login"}async function load(){let r=await fetch("/api/admin/events"),d=await r.json();events.innerHTML=d.length?d.map(x=>"<div style='padding:8px;border-bottom:1px solid #eee'>"+x.created_at+" — <b>"+x.target+"</b></div>").join(""):"None yet."}load();</script></body></html>
