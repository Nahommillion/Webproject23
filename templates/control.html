<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpinWheel Private Control</title>
<style>body{font-family:Arial,sans-serif;background:radial-gradient(circle at top,#173d87,#07132f 65%);color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(94vw,480px);background:#071b3ddd;border:1px solid #51d8ff55;padding:28px;border-radius:22px;box-shadow:0 25px 80px #0008}.logo{width:64px;height:64px}.field{width:100%;box-sizing:border-box;padding:15px;margin:7px 0;border-radius:11px;border:1px solid #5bcfff55;background:#031533;color:#fff;font-size:17px}.btn{width:100%;padding:15px;margin:7px 0;border-radius:11px;border:0;font-size:17px;font-weight:800;cursor:pointer}.win{background:linear-gradient(90deg,#ef3340,#ff6b35);color:#fff}.ok{background:#0f9f76;color:#fff}.muted{color:#9fbce4;font-size:13px}.status{min-height:24px;color:#70e4ff;font-weight:700}.hidden{display:none!important}.target{font-size:30px;font-weight:900;text-align:center;color:#62e5ff;padding:12px;word-break:break-word}</style></head>
<body><div class="card">
<img class="logo" src="/static/spinwheel-logo.svg" alt="SpinWheel"><h1>Private Owner Control</h1>
<section id="loginBox"><p class="muted">Sign in with the owner account to control the next winner from your phone.</p><input id="u" class="field" placeholder="Username" autocomplete="username"><input id="p" class="field" type="password" placeholder="Password" autocomplete="current-password"><button class="btn win" onclick="phoneLogin()">LOGIN & OPEN CONTROL</button><p id="loginStatus" class="status"></p></section>
<section id="controlBox" class="hidden"><p class="muted">Connected privately. This page is not shown on the public wheel.</p><input id="target" class="field" placeholder="Enter any number or name from the wheel"><button class="btn win" onclick="send()">MAKE THIS WIN</button><button class="btn ok" onclick="clearT()">CLEAR TARGET</button><div id="current" class="target">No target</div><p id="status" class="status">Connecting…</p><button class="btn" style="background:#173a72;color:#fff" onclick="location='/'">OPEN PUBLIC WHEEL</button></section>
</div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>
let token=new URLSearchParams(location.search).get('token')||'',s=null;
const $=id=>document.getElementById(id);
function showControl(){ $('loginBox').classList.add('hidden'); $('controlBox').classList.remove('hidden'); connect(); }
async function phoneLogin(){const username=$('u').value.trim(),password=$('p').value;if(!username||!password){$('loginStatus').textContent='Enter username and password.';return}try{const r=await fetch('/api/phone-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok){$('loginStatus').textContent=d.message||'Login failed.';return}token=new URL(d.control_url,location.origin).searchParams.get('token');history.replaceState({},'',d.control_url);showControl()}catch(e){$('loginStatus').textContent='Could not connect to the server.'}}
function connect(){if(typeof io!=='function'){$('status').textContent='Controller connection library did not load.';return}if(s)s.disconnect();s=io({transports:['websocket','polling']});s.on('connect',()=>{s.emit('owner_join',{token});$('status').textContent='Connected — ready to control the next spin.'});s.on('owner_ready',d=>{setCurrent(d.target);$('status').textContent=d.target?'Connected — current target: '+d.target:'Connected — no target set.'});s.on('target_changed',d=>{setCurrent(d.target);$('status').textContent=d.target?'Target accepted: '+d.target:'Target cleared.'});s.on('control_error',d=>{$('status').textContent=d.message||'Controller error.'});s.on('disconnect',()=>{$('status').textContent='Disconnected — reconnecting…'});}
function setCurrent(v){$('current').textContent=v?'TARGET: '+v:'No target'}
function send(){const t=$('target').value.trim();if(!t){$('status').textContent='Enter a number or name first.';return}if(!s||!s.connected){$('status').textContent='Not connected yet.';return}s.emit('set_target',{token,target:t})}
function clearT(){if(s&&s.connected)s.emit('clear_target',{token})}
if(token)showControl();
</script></body></html>
