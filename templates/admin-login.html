<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Login</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main style="max-width:420px;margin:90px auto;padding:20px"><section style="background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001"><h1>👑 Owner Login</h1><input id="u" placeholder="Username" style="width:100%;padding:12px;margin:7px 0"><input id="p" type="password" placeholder="Password" style="width:100%;padding:12px;margin:7px 0"><button onclick="login()" style="width:100%;background:#6c63ff;color:white">Login</button><p id="m"></p></section></main><script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let d=await r.json();if(r.ok)location='/admin';else m.textContent=d.message||'Login failed'}</script></body></html>
