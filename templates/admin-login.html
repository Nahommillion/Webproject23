<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Owner Control</title><style>body{font-family:Arial;background:#111827;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:min(92vw,480px);background:#1f2937;padding:28px;border-radius:20px}.card input,.card button{width:100%;padding:15px;margin:7px 0;border-radius:10px;border:0;font-size:18px}.win{background:#ef4444;color:white}.ok{background:#10b981;color:white}</style></head><body><div class="card"><h1>👑 Private Owner Control</h1><p>This is for your phone only.</p><input id="target" placeholder="Enter any number or name"><button class="win" onclick="send()">MAKE THIS WIN</button><button class="ok" onclick="clearT()">CLEAR TARGET</button><p id="status">Connecting...</p></div><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script>const token=new URLSearchParams(location.search).get("token"),s=io();s.on("connect",()=>s.emit("owner_join",{token}));s.on("owner_ready",d=>status.textContent=d.target?"Current target: "+d.target:"Connected — no target.");s.on("control_error",d=>status.textContent=d.message);function send(){let t=target.value.trim();if(!t)return alert("Enter a number or name.");s.emit("set_target",{token,target:t});status.textContent="Target sent: "+t}function clearT(){s.emit("clear_target",{token});status.textContent="Target cleared."}</script></body></html>
