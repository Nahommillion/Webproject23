services:
  - type: web
    name: spinwheel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 8 --workers 1 --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: SPIN_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
